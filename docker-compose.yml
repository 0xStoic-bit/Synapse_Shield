services:
  synapse-shield:
    build: .
    container_name: synapse-shield
    ports:
      - "8000:8000"
    volumes:
      - synapse-data:/app/data
    environment:
      - SYNAPSE_DEV_MODE=1
      # - SYNAPSE_REDIS_URL=redis://redis:6379/0
    # depends_on:
    #   - redis
    restart: unless-stopped

  # redis:
  #   image: redis:7-alpine
  #   container_name: synapse-redis
  #   ports:
  #     - "6379:6379"
  #   restart: unless-stopped

volumes:
  synapse-data:
