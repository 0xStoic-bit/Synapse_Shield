[package]
name = "synapse_core_rs"
version = "0.10.6"
edition = "2021"
authors = ["Mustafa Gungor <0xStoic-bit>"]
description = "High-performance native Rust core for Synapse Shield biometric & kinematic analysis"
license = "MIT"

[lib]
name = "synapse_core_rs"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Enabled by maturin (pyproject.toml `features`) for wheels only. With it on, Linux linkers refuse to
# link a test binary (libpython is intentionally not linked), so plain `cargo test` must leave it off.
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.22" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "curvature_bench"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = false
