[package]
name = "synapse_core_rs"
version = "0.8.0"
edition = "2021"
authors = ["Mustafa Gungor <0xStoic-bit>"]
description = "High-performance native Rust core for Synapse Shield biometric & kinematic analysis"
license = "MIT"

[lib]
name = "synapse_core_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = false
strip = true
