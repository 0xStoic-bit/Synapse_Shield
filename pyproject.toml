[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "synapse-shield"
version = "0.9.0"
authors = [
  { name="Mustafa Güngör", email="mustafagungor181881@gmail.com" },
]
description = "Next-Gen Open-Source Behavioral Biometrics & Bot Mitigation Engine"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = [
  "cybersecurity", "bot-detection", "turnstile-alternative",
  "behavioral-biometrics", "kinematics", "fastapi", "zero-pii"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Middleware",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "numpy>=1.26.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
frameworks = ["django>=3.2", "flask>=2.0"]
metrics = ["prometheus-client>=0.19.0"]
redis = ["redis>=5.0.0"]

[project.scripts]
synapse-shield = "synapse_shield.cli:main"

[tool.maturin]
manifest-path = "crates/synapse_core_rs/Cargo.toml"
python-source = "src"
module-name = "synapse_shield.synapse_core_rs"
include = [
    "src/synapse_shield/static/*",
    "src/synapse_shield/weights.npz"
]

[project.urls]
Homepage = "https://github.com/0xStoic-bit/Synapse_Shield"
Repository = "https://github.com/0xStoic-bit/Synapse_Shield"
Documentation = "https://github.com/0xStoic-bit/Synapse_Shield#readme"
Issues = "https://github.com/0xStoic-bit/Synapse_Shield/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:httpx.*",
    "ignore::DeprecationWarning:fastapi.*",
    "ignore::UserWarning:fastapi.*",
    "ignore::PendingDeprecationWarning"
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]