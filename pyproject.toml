[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "synapse-shield"
version = "0.10.5"
authors = [
  { name="Mustafa Güngör", email="" },
]
description = "Next-Gen Open-Source Behavioral Biometrics & Bot Mitigation Engine"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = [
  "cybersecurity", "bot-detection", "turnstile-alternative",
  "behavioral-biometrics", "kinematics", "fastapi", "zero-pii"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Middleware",
]
dependencies = [
    "numpy>=1.26.0",
]

[project.optional-dependencies]
server = ["fastapi>=0.110.0", "uvicorn>=0.29.0", "websockets>=12.0"]
cockpit = ["fastapi>=0.110.0", "uvicorn>=0.29.0", "websockets>=12.0"]
fastapi = ["fastapi>=0.110.0", "uvicorn>=0.29.0", "websockets>=12.0"]
frameworks = ["django>=3.2", "flask>=2.0", "litestar>=2.0.0", "sanic>=23.0.0"]
litestar = ["litestar>=2.0.0"]
sanic = ["sanic>=23.0.0"]
metrics = ["prometheus-client>=0.19.0"]
redis = ["redis>=5.0.0"]
all = [
    "fastapi>=0.110.0", "uvicorn>=0.29.0", "websockets>=12.0",
    "django>=3.2", "flask>=2.0", "litestar>=2.0.0", "sanic>=23.0.0",
    "prometheus-client>=0.19.0", "redis>=5.0.0"
]

[project.scripts]
synapse-shield = "synapse_shield.cli:main"

[tool.maturin]
manifest-path = "crates/synapse_core_rs/Cargo.toml"
features = ["pyo3/extension-module"]
python-source = "src"
module-name = "synapse_shield.synapse_core_rs"
include = [
    "src/synapse_shield/static/*",
    "src/synapse_shield/weights.npz",
    "src/synapse_shield/py.typed",
    "src/synapse_shield/synapse_core_rs.pyi",
    "LICENSE"
]
exclude = ["*.pdb", "*.log"]

[project.urls]
Homepage = "https://github.com/0xStoic-bit/Synapse_Shield"
Repository = "https://github.com/0xStoic-bit/Synapse_Shield"
Documentation = "https://github.com/0xStoic-bit/Synapse_Shield#readme"
Issues = "https://github.com/0xStoic-bit/Synapse_Shield/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:httpx.*",
    "ignore::DeprecationWarning:fastapi.*",
    "ignore::UserWarning:fastapi.*",
    "ignore::PendingDeprecationWarning"
]

# Mutation testing of the security core (Linux/WSL only; mutmut 3 has no native Windows support).
# Run: mutmut run && mutmut results    (CI: .github/workflows/mutation.yml, weekly + manual)
[tool.mutmut]
source_paths = ["src/"]
only_mutate = [
    "src/synapse_shield/tokens.py",
    "src/synapse_shield/core.py",
    "src/synapse_shield/storage.py",
]
mutate_only_covered_lines = true
also_copy = ["tests/"]
pytest_add_cli_args = ["-p", "no:cacheprovider", "-q"]
pytest_add_cli_args_test_selection = [
    "tests/test_crypto_core_edges.py",
    "tests/test_tokens.py",
    "tests/test_storage.py",
    "tests/test_storage_backends.py",
    "tests/test_security_patches.py",
    "tests/test_framework_contract.py",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
